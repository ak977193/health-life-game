<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康人生ゲーム</title><style>body{margin:0;background:#f4ead7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#222}.screen{display:none;min-height:100vh;padding:12px;box-sizing:border-box}.active{display:block}.wrap{max-width:900px;margin:auto}.panel{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0002}.startimg{width:100%;display:block;border-radius:12px}.ages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.age,button{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700}.age{background:#fff1b8;border:2px solid #97751d}.age.sel{background:#ffd34d}#start{display:block;margin:14px auto;background:#b72c23;color:#fff}.center{text-align:center}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#faf7ef;padding:8px 14px;border-radius:10px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{min-height:62px;background:#fff;border:2px solid #bbb;border-radius:10px;padding:6px;font-size:12px;position:relative}.cell.now{outline:4px solid #e67e22}.piece{position:absolute;right:3px;bottom:0;font-size:23px}.dicePanel{margin:14px 0 10px;padding:18px;background:#fff;border:3px solid #2874a6;border-radius:18px;box-shadow:0 4px 14px #0003}.diceTitle{font-size:20px;font-weight:900;color:#2874a6;margin-bottom:4px}.diceHint{font-size:14px;margin-bottom:2px}.diceArea{display:flex;align-items:center;justify-content:center;gap:12px;min-height:95px}#die{font-size:72px;height:90px;display:flex;align-items:center;justify-content:center;transition:transform .15s}#die.rolling{animation:diceRoll .12s linear infinite}#roll{background:#2874a6;color:#fff;font-size:21px;padding:15px 28px;width:90%;max-width:360px}.rolling-note{font-size:15px;font-weight:700;min-height:21px;margin:3px 0 8px}@keyframes diceRoll{0%{transform:rotate(-12deg) scale(.95)}50%{transform:rotate(12deg) scale(1.08)}100%{transform:rotate(-12deg) scale(.95)}}.ability{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ability .stat{font-size:14px;text-align:center}.wheel{width:270px;height:270px;border-radius:50%;margin:15px auto;position:relative;background:conic-gradient(#e7d18a 0 50%,#b8d7a7 50% 70%,#9cc7df 70% 90%,#d5a4a4 90% 100%)}.w{position:absolute;transform:translate(-50%,-50%);font-weight:900}.s{left:50%;top:23%}.n{left:78%;top:54%}.e{left:48%;top:82%}.t{left:20%;top:56%}.choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice button{min-width:145px}</style></head><body><section id="startScreen" class="screen active"><div class="wrap"><img class="startimg" src="IMG_8878.jpeg" alt="健康人生ゲーム スタート画面"><div class="panel center"><b>年代を選択</b><div class="ages"><button class="age" data-a="20">20代</button><button class="age" data-a="30">30代</button><button class="age" data-a="40">40代</button><button class="age" data-a="50">50代</button><button class="age" data-a="60">60代</button></div><button id="start">ゲームスタート</button></div></div></section><section id="gameScreen" class="screen"><div class="wrap"><h1 class="center">🎲 健康人生ゲーム</h1><div class="panel stats"><div class="stat">年代<br><b id="age"></b></div><div class="stat">経過<br><b id="months">0 / 120か月</b></div><div class="stat">貯金<br><b id="money">0万円</b></div></div><div class="panel ability"><div class="stat">💪 体力<br><b id="hp">0%</b></div><div class="stat">⚡ スタミナ<br><b id="stamina">0%</b></div><div class="stat">🏃 すばやさ<br><b id="speed">0%</b></div></div><div class="dicePanel center"><div class="diceTitle">🎲 今月のサイコロ</div><div class="diceHint">1回振る ＝ 1か月進む</div><div class="diceArea"><div id="die">🎲</div></div><div id="rollNote" class="rolling-note">サイコロを振ってください</div><button id="roll">🎲 サイコロを振る</button></div><div id="board" class="board"></div></div></section><section id="eventScreen" class="screen"><div class="wrap"><div class="panel center"><h1>📍 今月のイベント</h1><h2 id="eventTitle"></h2><p id="eventText"></p><b id="eventEffect"></b><p><button id="toHealth">イベント終了 → 健康サークル</button></p></div></div></section><section id="healthScreen" class="screen"><div class="wrap"><div class="panel center"><h1>🎡 健康サークル</h1><p>健康サークルを回します。</p><div class="wheel"><span class="w s">睡眠<br>50%</span><span class="w n">栄養<br>20%</span><span class="w e">運動<br>20%</span><span class="w t">施術<br>10%</span></div><button id="spin">健康サークルを回す</button><p id="result"></p><div id="choice" style="display:none"><p id="choiceText"></p><div class="choice"><button id="buy">購入する</button><button id="skip">今回は見送る</button></div></div></div></div></section><section id="finishScreen" class="screen"><div class="wrap"><div class="panel center"><h1>🏁 10年間終了！</h1><h2>体力：<span id="fh"></span></h2><h2>スタミナ：<span id="fs"></span></h2><h2>すばやさ：<span id="fv"></span></h2><h2>貯金：<span id="fm"></span></h2><button onclick="location.reload()">もう一度遊ぶ</button></div></div></section><script>const S=["スタート","給料日","忙しい月","健康診断","臨時収入","外食続き","運動を始める","ボーナス","疲労蓄積","休暇","思わぬ出費","健康習慣","昇給","睡眠不足","家族イベント","臨時収入","運動習慣","ケガ","ボーナス","食生活改善","大きな買い物","健康診断","旅行","仕事が忙しい","臨時収入","休養","医療費","健康イベント","ラッキー！","10年目"];const A={20:[100,100,100,0],30:[70,70,70,10],40:[50,50,50,20],50:[40,40,40,30],60:[30,30,30,40]};let age=0,hp=0,stamina=0,speed=0,m=0,pos=0,month=0,cur="",cost=0;const $=x=>document.getElementById(x);function show(x){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(x).classList.add('active');scrollTo(0,0)}function render(){$('age').textContent=age+'代';$('months').textContent=month+' / 120か月';$('hp').textContent=hp+'%';$('stamina').textContent=stamina+'%';$('speed').textContent=speed+'%';$('money').textContent=m+'万円';$('board').innerHTML=S.map((x,i)=>'<div class="cell '+(i===pos?'now':'')+'"><b>'+i+'</b><br>'+x+(i===pos?'<span class="piece">🧑</span>':'')+'</div>').join('')}document.querySelectorAll('.age').forEach(b=>b.onclick=()=>{document.querySelectorAll('.age').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');age=+b.dataset.a});$('start').onclick=()=>{if(!age)return alert('年代を選んでください');[hp,stamina,speed,m]=A[age];month=0;pos=0;render();show('gameScreen')};$('roll').onclick=()=>{if(month>=120||$('roll').disabled)return;$('roll').disabled=true;$('die').classList.add('rolling');$('rollNote').textContent='サイコロを振っています…';let n=1+Math.floor(Math.random()*6),count=0,timer=setInterval(()=>{$('die').textContent=(1+Math.floor(Math.random()*6))+' 🎲';count++;if(count>=9){clearInterval(timer);$('die').textContent=n+' 🎲';$('die').classList.remove('rolling');$('rollNote').textContent='🎲 '+n+' が出ました！';setTimeout(()=>{moveStepByStep(n)},450)}},120)};function moveStepByStep(n){let steps=0;function step(){if(steps<n){pos=Math.min(S.length-1,pos+1);steps++;render();$('rollNote').textContent='🚶 '+steps+' / '+n+' マス';setTimeout(step,450)}else{month++;let title=S[pos],md={'給料日':10,'臨時収入':5,'ボーナス':15,'昇給':10,'ラッキー！':10,'思わぬ出費':-10,'家族イベント':-5,'大きな買い物':-15,'旅行':-5,'医療費':-10};if(md[title])m+=md[title];$('eventTitle').textContent=title;$('eventText').textContent='このマスのイベントを消化します。';$('eventEffect').textContent=md[title]?(md[title]>0?'＋'+md[title]+'万円':'−'+(-md[title])+'万円'):'';render();$('roll').disabled=false;show('eventScreen')}}step()}$('toHealth').onclick=()=>{show('healthScreen');$('result').textContent='';$('choice').style.display='none';$('spin').style.display='inline-block'};$('spin').onclick=()=>{let r=Math.random()*100;if(r<50){cur='睡眠';cost=20}else if(r<70){cur='栄養';cost=1}else if(r<90){cur='運動';cost=2}else{cur='施術';cost=1}$('result').textContent='🎡 '+cur+' が出ました！';$('choiceText').textContent='費用 '+cost+'万円。購入しますか？';$('choice').style.display='block';$('spin').style.display='none'};function done(buy){if(buy&&m>=cost){m-=cost;if(cur==='睡眠')hp=Math.min(100,hp+1);if(cur==='施術')hp=Math.min(100,hp+2);if(cur==='栄養')stamina=Math.min(100,stamina+.5);if(cur==='運動')speed=Math.min(100,speed+.5);$('result').textContent='購入しました！'}else if(buy){$('result').textContent='貯金が足りません。'}else{$('result').textContent='今回は見送りました。'}$('choice').style.display='none';render();setTimeout(()=>{if(month>=120){$('fh').textContent=hp+'%';$('fs').textContent=stamina+'%';$('fv').textContent=speed+'%';$('fm').textContent=m+'万円';show('finishScreen')}else show('gameScreen')},500)}$('buy').onclick=()=>done(true);$('skip').onclick=()=>done(false);render();</script></body></html>
