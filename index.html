<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康人生ゲーム</title><style>body{margin:0;background:#f4ead7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#222}.screen{display:none;min-height:100vh;padding:12px;box-sizing:border-box}.active{display:block}.wrap{max-width:900px;margin:auto}.panel{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0002}.startimg{width:100%;display:block;border-radius:12px}.center{text-align:center}.ages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.age,button{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700}.age{background:#fff1b8;border:2px solid #97751d}.age.sel{background:#ffd34d}#startButton{display:block;margin:14px auto;background:#b72c23;color:#fff}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#faf7ef;padding:8px 14px;border-radius:10px}.ability{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ability .stat{text-align:center;font-size:14px}.dicePanel{margin:14px 0 10px;padding:18px;background:#fff;border:3px solid #2874a6;border-radius:18px;box-shadow:0 4px 14px #0003}.diceTitle{font-size:20px;font-weight:900;color:#2874a6}.diceArea{display:flex;align-items:center;justify-content:center;min-height:95px}.die{font-size:72px}.rolling{animation:diceRoll .12s linear infinite}@keyframes diceRoll{0%{transform:rotate(-12deg) scale(.95)}50%{transform:rotate(12deg) scale(1.08)}100%{transform:rotate(-12deg) scale(.95)}}#roll{background:#2874a6;color:#fff;font-size:21px;padding:15px 28px;width:90%;max-width:360px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{min-height:62px;background:#fff;border:2px solid #bbb;border-radius:10px;padding:6px;font-size:12px;position:relative}.cell.now{outline:4px solid #e67e22}.piece{position:absolute;right:3px;bottom:0;font-size:23px}.wheelPointer{font-size:34px;line-height:1;margin:0 auto -5px;position:relative;z-index:2}.wheel{width:270px;height:270px;border-radius:50%;margin:15px auto;background:conic-gradient(from 0deg,#e7d18a 0deg 180deg,#b8d7a7 180deg 252deg,#9cc7df 252deg 324deg,#d5a4a4 324deg 360deg);position:relative;will-change:transform}.w{position:absolute;transform:translate(-50%,-50%);font-weight:900}.s{left:78%;top:50%}.n{left:31%;top:76%}.e{left:20%;top:40%}.t{left:40%;top:21%}.choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice button{min-width:145px}</style></head><body><section id="startScreen" class="screen active"><div class="wrap"><img class="startimg" src="IMG_8878.jpeg" alt="健康人生ゲーム スタート画面"><div class="panel center"><b>年代を選択</b><div class="ages"><button class="age" data-age="20">20代</button><button class="age" data-age="30">30代</button><button class="age" data-age="40">40代</button><button class="age" data-age="50">50代</button><button class="age" data-age="60">60代</button></div><button id="startButton">ゲームスタート</button></div></div></section><section id="gameScreen" class="screen"><div class="wrap"><h1 class="center">🎲 健康人生ゲーム</h1><div class="panel stats"><div class="stat">年代<br><b id="age"></b></div><div class="stat">経過<br><b id="months">0 / 120か月</b></div><div class="stat">貯金<br><b id="money">0万円</b></div></div><div class="panel ability"><div class="stat">💪 体力<br><b id="hp">0%</b></div><div class="stat">⚡ スタミナ<br><b id="stamina">0%</b></div><div class="stat">🏃 すばやさ<br><b id="speed">0%</b></div></div><div class="dicePanel center"><div class="diceTitle">🎲 今月のサイコロ</div><div>1回振る ＝ 1か月進む</div><div class="diceArea"><div id="die" class="die">🎲</div></div><div id="rollNote">サイコロを振ってください</div><button id="roll">🎲 サイコロを振る</button></div><div id="board" class="board"></div></div></section><section id="eventScreen" class="screen"><div class="wrap"><div class="panel center"><h1>📍 今月のイベント</h1><h2 id="eventTitle"></h2><p id="eventText"></p><b id="eventEffect"></b><p><button id="toHealth">イベント終了 → 健康サークル</button></p></div></div></section><section id="healthScreen" class="screen"><div class="wrap"><div class="panel center"><h1>🎡 健康サークル</h1><p>健康サークルを回します。</p><div class="wheelPointer">▼</div><div id="wheel" class="wheel"><span class="w s">睡眠<br>50%</span><span class="w n">栄養<br>20%</span><span class="w e">運動<br>20%</span><span class="w t">施術<br>10%</span></div><button id="spin">健康サークルを回す</button><p id="result"></p><div id="choice" style="display:none"><p id="choiceText"></p><div class="choice"><button id="buy">購入する</button><button id="skip">今回は見送る</button></div></div></div></div></section><section id="finishScreen" class="screen"><div class="wrap"><div class="panel center"><h1>🏁 10年間終了！</h1><h2>体力：<span id="fh"></span></h2><h2>スタミナ：<span id="fs"></span></h2><h2>すばやさ：<span id="fv"></span></h2><h2>貯金：<span id="fm"></span></h2><button id="again">もう一度遊ぶ</button></div></div></section><script>document.addEventListener('DOMContentLoaded',function(){const $=id=>document.getElementById(id);const spaces=['スタート','給料日','忙しい月','健康診断','臨時収入','外食続き','運動を始める','ボーナス','疲労蓄積','休暇','思わぬ出費','健康習慣','昇給','睡眠不足','家族イベント','臨時収入','運動習慣','ケガ','ボーナス','食生活改善','大きな買い物','健康診断','旅行','仕事が忙しい','臨時収入','休養','医療費','健康イベント','ラッキー！','10年目'];const initial={20:[100,100,100,0],30:[70,70,70,10],40:[50,50,50,20],50:[40,40,40,30],60:[30,30,30,40]};const moneyEvents={'給料日':10,'臨時収入':5,'ボーナス':15,'昇給':10,'ラッキー！':10,'思わぬ出費':-10,'家族イベント':-5,'大きな買い物':-15,'旅行':-5,'医療費':-10};let selectedAge=0,hp=0,stamina=0,speed=0,money=0,month=0,pos=0,current='',cost=0,rolling=false,wheelAngle=0,sleepMonths=0,nutritionMonths=0,exerciseMonths=0;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='gameScreen'){$('roll').disabled=false;$('die').classList.remove('rolling');$('rollNote').textContent='サイコロを振ってください';rolling=false}window.scrollTo(0,0)}function render(){$('age').textContent=selectedAge+'代';$('months').textContent=month+' / 120か月';$('money').textContent=money+'万円';$('hp').textContent=hp+'%';$('stamina').textContent=stamina+'%';$('speed').textContent=speed+'%';$('board').innerHTML=spaces.map((x,i)=>'<div class="cell '+(i===pos?'now':'')+'"><b>'+(i+1)+'</b><br>'+x+(i===pos?'<span class="piece">🧑</span>':'')+'</div>').join('')}document.querySelectorAll('.age').forEach(btn=>btn.addEventListener('click',function(){document.querySelectorAll('.age').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');selectedAge=Number(this.dataset.age)}));$('startButton').addEventListener('click',function(){if(!selectedAge){alert('年代を選んでください');return}[hp,stamina,speed,money]=initial[selectedAge];month=0;pos=0;sleepMonths=0;nutritionMonths=0;exerciseMonths=0;render();show('gameScreen')});$('roll').addEventListener('click',function(){if(rolling||month>=120)return;rolling=true;$('roll').disabled=true;$('die').classList.add('rolling');$('rollNote').textContent='サイコロを振っています…';const result=1+Math.floor(Math.random()*6);let count=0;const timer=setInterval(function(){$('die').textContent=(1+Math.floor(Math.random()*6))+' 🎲';count++;if(count>=9){clearInterval(timer);$('die').textContent=result+' 🎲';$('die').classList.remove('rolling');$('rollNote').textContent='🎲 '+result+' が出ました！';setTimeout(()=>move(result),400)}},120)});function move(n){let step=0;function next(){if(step<n){pos=Math.min(spaces.length-1,pos+1);step++;render();$('rollNote').textContent='🚶 '+step+' / '+n+' マス';setTimeout(next,350);return}month++;const title=spaces[pos];const delta=moneyEvents[title]||0;money+=delta;hp=Math.max(0,hp-5+(sleepMonths>0?5:0));stamina=Math.max(0,stamina-2+(nutritionMonths>0?3:0));speed=Math.max(0,speed-2+(exerciseMonths>0?3:0));if(sleepMonths>0)sleepMonths--;if(nutritionMonths>0)nutritionMonths--;if(exerciseMonths>0)exerciseMonths--;const before={hp:hp,stamina:stamina,speed:speed,money:money};if(title==='睡眠不足'){const b=hp;hp=Math.max(0,hp-5);$('eventEffect').textContent='体力 '+b+'% → '+hp+'%'}else if(title==='家族イベント'){const bh=hp,bm=money;hp=Math.max(0,hp-2);money-=5;$('eventEffect').innerHTML='体力 '+bh+'% → '+hp+'%<br>貯金 '+bm+'万円 → '+money+'万円'}else if(title==='ケガ'){const bh=hp,bs=stamina,bv=speed;hp=Math.max(0,hp-3);stamina=Math.max(0,stamina-3);speed=Math.max(0,speed-3);$('eventEffect').innerHTML='体力 '+bh+'% → '+hp+'%<br>スタミナ '+bs+'% → '+stamina+'%<br>すばやさ '+bv+'% → '+speed+'%'}else if(title==='食生活改善'){const bh=hp,bs=stamina,bv=speed;hp=Math.min(100,hp+3);stamina=Math.min(100,stamina+3);speed=Math.min(100,speed+3);$('eventEffect').innerHTML='体力 '+bh+'% → '+hp+'%<br>スタミナ '+bs+'% → '+stamina+'%<br>すばやさ '+bv+'% → '+speed+'%'}else if(delta){$('eventEffect').textContent='貯金 '+(money-delta)+'万円 → '+money+'万円'}else{$('eventEffect').textContent='今回のイベントによる変動なし'}$('eventTitle').textContent=title;$('eventText').textContent='今回の変動';render();rolling=false;$('roll').disabled=false;show('eventScreen')}next()}$('toHealth').addEventListener('click',function(){show('healthScreen');$('result').textContent='';$('choice').style.display='none';$('spin').style.display='inline-block';$('spin').disabled=false});$('spin').addEventListener('click',function(){if(this.disabled)return;this.disabled=true;$('choice').style.display='none';$('result').textContent='🎡 健康サークルを回しています…';const r=Math.random()*100;let target;if(r<50)target='睡眠';else if(r<70)target='栄養';else if(r<90)target='運動';else target='施術';current=target;cost=target==='睡眠'?20:target==='栄養'?1:target==='運動'?2:1;const wheel=$('wheel');const center={睡眠:90,栄養:216,運動:288,施術:342}[target];const currentAngle=((wheelAngle%360)+360)%360;const needed=(360-center-currentAngle+360)%360;const extra=1440+needed;const startAngle=wheelAngle;const startTime=performance.now();const duration=2800;function animate(now){const p=Math.min(1,(now-startTime)/duration);const ease=1-Math.pow(1-p,4);wheel.style.transform='rotate('+(startAngle+extra*ease)+'deg)';if(p<1)requestAnimationFrame(animate);else{wheelAngle=startAngle+extra;wheel.style.transform='rotate('+wheelAngle+'deg)';$('result').textContent='🎯 '+current+' に止まりました！';$('choiceText').textContent='費用 '+cost+'万円。購入しますか？';$('choice').style.display='block';this.disabled=false}}requestAnimationFrame(animate)});function finishChoice(buy){if(buy&&money>=cost){money-=cost;if(current==='睡眠'){sleepMonths=120}if(current==='施術')hp=Math.min(100,hp+10);if(current==='栄養'){nutritionMonths=1;stamina=Math.min(100,stamina+3)}if(current==='運動'){exerciseMonths=60;speed=Math.min(100,speed+3)}$('result').textContent='購入しました！'}else if(buy)$('result').textContent='貯金が足りません。';else $('result').textContent='今回は見送りました。';$('choice').style.display='none';render();setTimeout(function(){if(month>=120){$('fh').textContent=hp+'%';$('fs').textContent=stamina+'%';$('fv').textContent=speed+'%';$('fm').textContent=money+'万円';show('finishScreen')}else show('gameScreen')},500)}$('buy').addEventListener('click',()=>finishChoice(true));$('skip').addEventListener('click',()=>finishChoice(false));$('again').addEventListener('click',()=>location.reload());render()});</script></body></html>
